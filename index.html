  <body>
<div id="app">
  <header class="top">
    <div class="id">
      <div class="lang">
        <button
          id="langBtn"
          data-act="lang"
          aria-haspopup="true"
          aria-expanded="false"
          data-i-aria="ariaLang"
        ></button>
        <div class="langmenu" id="langMenu" hidden></div>
      </div>
      <input
        id="teamName"
        maxlength="24"
        data-i-aria="ariaName"
        autocomplete="off"
        spellcheck="false"
      />
      <span class="era" id="eraTag"></span>
    </div>
    <div class="speed" role="group" data-i-aria="ariaSpeed">
      <button data-speed="0" aria-pressed="false" data-i-aria="ariaPause">II</button>
      <button data-speed="1" aria-pressed="true">x1</button>
      <button data-speed="2" aria-pressed="false">x2</button>
      <button data-speed="3" aria-pressed="false">x3</button>
      <button data-speed="5" aria-pressed="false">x5</button>
      <button data-speed="10" aria-pressed="false" hidden>x10</button>
    </div>
    <div class="bank">
      <span class="pts" id="pts">0</span><span class="unit" data-i="pts">PTS</span
      ><span class="rate" id="pps">+0/s</span>
    </div>
  </header>
  <main id="view">
    <div class="cols">
      <div class="col col-a">
        <section class="sec on" id="sec-court" data-sec="court">
          <div class="court-wrap" id="courtWrap">
            <svg class="court" viewBox="0 0 360 300" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <pattern id="wood" width="360" height="24" patternUnits="userSpaceOnUse">
                  <rect width="360" height="12" fill="#c8782e" />
                  <rect y="12" width="360" height="12" fill="#b9691f" />
                </pattern>
              </defs>
              <rect width="360" height="300" fill="url(#wood)" />
              <rect x="125" y="0" width="110" height="140" fill="#e2231a" />
              <g fill="none" stroke="#fff" stroke-width="4">
                <path d="M125 0V140H235V0" />
                <path d="M125 140A55 55 0 0 1 235 140" />
                <path stroke-dasharray="8 8" d="M125 140A55 55 0 0 0 235 140" />
                <path d="M28 0V98A152 152 0 0 0 332 98V0" />
                <path d="M120 300A60 60 0 0 1 240 300" />
              </g>
              <rect
                x="150"
                y="6"
                width="60"
                height="8"
                fill="#fff"
                stroke="#000"
                stroke-width="2"
              />
              <rect
                x="172"
                y="14"
                width="16"
                height="4"
                fill="#ff8a00"
                stroke="#000"
                stroke-width="2"
              />
              <path d="M172 18l3 10M188 18l-3 10M180 18v10" stroke="#fff" stroke-width="2" />
              <rect
                x="2"
                y="2"
                width="356"
                height="296"
                fill="none"
                stroke="#000"
                stroke-width="4"
              />
            </svg>
            <span class="hoop" id="hoop"></span>
            <span class="fire-tag" id="fireTag" data-i="fire" hidden></span>
            <button class="shoot" id="shoot" data-act="shoot" data-i-aria="ariaShoot">
              <svg class="ballsvg" viewBox="0 0 100 100" aria-hidden="true">
                <circle class="ball-fill" cx="50" cy="50" r="46" stroke="#000" stroke-width="6" />
                <path
                  class="seam"
                  d="M4 50H96M50 4V96M20 16C42 34 42 66 20 84M80 16C58 34 58 66 80 84"
                />
              </svg>
              <b data-i="shoot"></b>
            </button>
            <button class="bb" id="bb" data-act="bb" data-i="bb" hidden></button>
          </div>
          <div id="info"></div>
        </section>
        <section class="sec" id="sec-club" data-sec="club"></section>
      </div>
      <div class="col col-b">
        <section class="sec" id="sec-roster" data-sec="roster"></section>
        <section class="sec" id="sec-season" data-sec="season"></section>
        <section class="sec" id="sec-legends" data-sec="legends"></section>
      </div>
    </div>
  </main>
  <nav class="tabs" data-i-aria="ariaTabs"><div class="tabs-in" id="tabs"></div></nav>
</div>
<div id="pick" class="pick" hidden>
  <div class="panel">
    <h2 class="ph" data-i="pickTitle"></h2>
    <div class="pb">
      <p class="hint" data-i="pickHint"></p>
      <button class="btn pri big" data-pick="m" data-i="pickM"></button>
      <button class="btn pri big" data-pick="f" data-i="pickF"></button>
    </div>
  </div>
</div>
<div id="pop" class="pick" hidden>
  <div class="panel">
    <h2 class="ph" id="popT"></h2>
    <div class="pb">
      <p class="hint" id="popB"></p>
      <button class="btn pri big" data-act="popok" data-i="popOk"></button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="i18n.js?v=31"></script>
    <script src="main.js?v=31"></script>
  </body>
